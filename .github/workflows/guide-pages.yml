name: guide-pages

on:
  push:
    branches: [master]
    paths:
      - "docs/guide/**"
      - "docs/authoring/story-guide.md"
      - "src/guide/**"
      - "scripts/docs/**"
      - "src/**/*.stories.tsx"
      - ".storybook/**"
      - ".github/workflows/guide-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guide-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: guide bundle and site checks
        run: node --test scripts/docs/guide-bundle.test.mjs scripts/docs/guide-site.test.mjs scripts/docs/site-extras.test.mjs
      - name: storybook build (mocks only)
        run: npm run storybook:build
      - run: node scripts/docs/guide-site.mjs --storybook .sb-static
      - name: links, page budget, privacy scan, media records, diagram sources
        run: node scripts/docs/site-check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .guide-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
