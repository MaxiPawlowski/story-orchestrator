<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Model Settings</title>
<style>
:root { --bg: #171717; --panel: #222327; --line: #3a3b40; --text: #dcdcd2; --dim: #9a9a92; --accent: #c2a26a; --good: #6fae75; --warn: #d0a24c; --bad: #c96a5e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Noto Sans", "Segoe UI", system-ui, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
h2 { font-size: 15px; margin: 24px 0 8px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
p.sub { margin: 0 0 16px; color: var(--dim); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.meter b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter span { color: var(--dim); font-size: 13px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.mode { text-align: left; cursor: pointer; color: var(--text); font: inherit; }
.mode:hover { border-color: var(--accent); }
.mode.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mode strong { display: block; font-size: 16px; text-transform: capitalize; }
.mode small { color: var(--dim); }
table { width: 100%; border-collapse: collapse; }
td { padding: 10px 6px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; }
td.k { width: 46%; }
td.k div { font-weight: 600; }
td.k p { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
td.k em { color: var(--warn); font-style: normal; font-size: 12px; }
input[type=number], select { width: 140px; background: #1b1c1f; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.range { color: var(--dim); font-size: 12px; display: block; margin-top: 4px; }
.changed { border-color: var(--accent) !important; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
button.act { background: #2d2e33; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
button.act.primary { border-color: var(--accent); color: var(--accent); }
button.act:disabled { opacity: .45; cursor: default; }
#msg { color: var(--dim); }
#msg.err { color: var(--bad); }
#msg.ok { color: var(--good); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
.dot.up { background: var(--good); }
.dot.pend { background: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Local model settings</h1>
  <p class="sub"><span id="health" class="dot"></span><span id="status">Reading the controller…</span></p>
  <div class="meters">
    <div class="panel meter"><b id="gpu">–</b><span>GPU memory free</span></div>
    <div class="panel meter"><b id="ram">–</b><span>RAM available</span></div>
    <div class="panel meter"><b id="mode">–</b><span>Mode in use</span></div>
  </div>
  <h2>Performance mode</h2>
  <div class="modes" id="modes"></div>
  <h2>Fine-tune</h2>
  <div class="panel">
    <table><tbody id="knobs"></tbody></table>
    <div class="bar">
      <button class="act primary" id="save" disabled>Save as custom</button>
      <button class="act" id="reset" disabled>Undo edits</button>
      <span id="msg"></span>
    </div>
  </div>
  <p class="sub" style="margin-top:16px">Every change backs up config.json first. Settings marked “next text load” take effect the next time the text model loads; nothing running is interrupted.</p>
</main>
<script src="/ui/app.js"></script>
</body>
</html>
